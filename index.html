<script>
const GY=360,G=900,R=13,HX=744,HY=140,BX=782,K=3.45;
const courts=[
 {n:'Street',sky:0x9fb4c8,g:0xffffff,w:0xffffff},
 {n:'Strand',sky:0x6ec6f0,g:0xf2dca0,w:0xf4e8cc},
 {n:'Wüste',sky:0xf2b06a,g:0xe0a468,w:0xe8b080},
 {n:'Apokalypse',sky:0x3a1c1a,g:0x8a6a62,w:0x9a5a4a}];
let st={court:0,score:0,best:0,xp:0,streak:0,power:null,shots:0,hits:0,cs:0,done:{},bestE:0,bestA:0,snd:false,ach:{},cnt:{},ts:{},log:[]};
try{const s=JSON.parse(localStorage.getItem('sd3')||'{}');Object.assign(st,{best:s.best||0,xp:s.xp||0,court:s.court||0,done:s.done||{},bestE:s.bestE||0,bestA:s.bestA||0,snd:!!s.snd,ach:s.ach||{},cnt:s.cnt||{},ts:s.ts||{},log:s.log||[]})}catch(e){}

const $=id=>document.getElementById(id);

 switch(n){
  case'ground':osc(70+60*p,.2,'sine',.5*p,42);osc(190,.09,'sine',.18*p,110);nz(.06,.35*p,'lowpass',700,.7);break;
  case'rim':[[360,.34],[740,.26],[1180,.18]].forEach((x,i)=>osc(x[0],x[1],'sine',.2*p/(i+1),0,0,.004));nz(.03,.14*p,'lowpass',1600,.7);break;
  case'board':osc(150+40*p,.16,'sine',.35*p,95);osc(310,.22,'triangle',.07*p,260);nz(.05,.3*p,'lowpass',900,.7);break;
  case'wall':osc(95,.12,'sine',.4*p,60);nz(.07,.3*p,'lowpass',520,.7);break;
  case'ball':osc(330,.09,'sine',.18*p,250);nz(.03,.25*p,'bandpass',1500,1.2);break;
  case'swish':nz(.38,.5,'bandpass',3600,.55,0,.07);nz(.2,.18,'highpass',6000,.7,.06,.05);break;
  case'score':nz(.28,.3,'bandpass',3200,.6,0,.05);break;
  case'ach':[[988,.55],[1480,.45],[1976,.35]].forEach((x,i)=>osc(x[0],x[1],'sine',.14/(i+1),0,i*.012,.004));break;
  case'power':[523,659,784,1047].forEach((f,i)=>osc(f,.28,'triangle',.1,0,i*.07,.005));break;
  case'air':osc(560,.75,'triangle',.12,170,0,.03);break;
  case'end':{const a=snd();if(!a)break;const t0=a.currentTime,lf=a.createBiquadFilter();lf.type='lowpass';lf.frequency.value=1400;const g=a.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.2,t0+.02);g.gain.setValueAtTime(.2,t0+.75);g.gain.exponentialRampToValueAtTime(.0001,t0+1);lf.connect(g);g.connect(a.destination);[[180,'sawtooth'],[183,'sawtooth'],[360,'square']].forEach(x=>{const o=a.createOscillator();o.type=x[1];o.frequency.value=x[0];o.connect(lf);o.start(t0);o.stop(t0+1.05)})}break}}

// ---------- Three.js Szene ----------
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.outputEncoding=THREE.sRGBEncoding;
ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(ren.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(34,2,10,4000);
let sketch=false;
const rtC=new THREE.WebGLRenderTarget(2,2),rtN=new THREE.WebGLRenderTarget(2,2);
rtC.texture.encoding=THREE.sRGBEncoding;
const NMAT=new THREE.MeshNormalMaterial(),qs=new THREE.Scene(),qc=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const qm=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{t:{value:rtC.texture},n:{value:rtN.texture},px:{value:new THREE.Vector2(1,1)},k:{value:1},time:{value:0}},
vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
fragmentShader:`uniform sampler2D t;uniform sampler2D n;uniform vec2 px;uniform float k;uniform float time;varying vec2 v;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float L(vec2 u){return dot(texture2D(t,u).rgb,vec3(.299,.587,.114));}
vec3 N(vec2 u){return texture2D(n,u).rgb;}
float ink(vec2 u,vec2 o){
 float tl=L(u+o*vec2(-1.,1.)),t0=L(u+o*vec2(0.,1.)),tr=L(u+o*vec2(1.,1.)),l0=L(u+o*vec2(-1.,0.)),r0=L(u+o*vec2(1.,0.)),bl=L(u+o*vec2(-1.,-1.)),b0=L(u+o*vec2(0.,-1.)),br=L(u+o*vec2(1.,-1.));
 float gx=-tl-2.*l0-bl+tr+2.*r0+br,gy=-tl-2.*t0-tr+bl+2.*b0+br;
 float el=smoothstep(.6,1.1,sqrt(gx*gx+gy*gy));
 float en=length(N(u+o*vec2(1.,0.))-N(u-o*vec2(1.,0.)))+length(N(u+o*vec2(0.,1.))-N(u-o*vec2(0.,1.)));

}
void main(){
 float tt=0.;
 vec2 o=px*k*1.2;
 vec2 c=v/px/k;
 vec2 j1=(vec2(nz(c/40.+tt),nz(c/40.+tt+31.))-.5)*px*k*1.4;
 vec2 j2=(vec2(nz(c/55.+tt+7.),nz(c/55.+tt+91.))-.5)*px*k*1.4;
 float e=max(ink(v+j1,o),.8*ink(v+j2+px*k*1.5,o));

 float dk=clamp(1.0-l*1.45,0.,1.);
 float w1=clamp((dk-.5)*.8,0.,.2),w2=clamp((dk-.9)*1.5,0.,.15);
 float m1=1.-step(w1,abs(fract((c.x+c.y)/9.)-.5)*2.);
 float m2=1.-step(w2,abs(fract((c.x-c.y)/9.)-.5)*2.);
 float hatch=max(w1>0.?m1:0.,w2>0.?m2:0.)*.5;
 float paper=.965-.03*nz(c*.6)-.02*nz(c*.07);
 gl_FragColor=vec4(vec3(mix(paper,.1,max(e,hatch))),1.);
}`});
qs.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),qm));
function sizeRT(){const s=ren.getDrawingBufferSize(new THREE.Vector2());rtC.setSize(s.x,s.y);rtN.setSize(s.x,s.y);qm.uniforms.px.value.set(1/s.x,1/s.y);qm.uniforms.k.value=s.x/innerWidth}
function renderFrame(now){
 if(!sketch){ren.setRenderTarget(null);ren.render(scene,cam);return}
 ren.setRenderTarget(rtC);ren.render(scene,cam);
 const hid=[];scene.traverse(o=>{if((o.isSprite||o.isLine||o.isPoints)&&o.visible){o.visible=false;hid.push(o)}});
 const bg=scene.background,fg=scene.fog;scene.background=null;scene.fog=null;scene.overrideMaterial=NMAT;
 ren.setRenderTarget(rtN);ren.render(scene,cam);
 scene.overrideMaterial=null;scene.background=bg;scene.fog=fg;hid.forEach(o=>o.visible=true);
 ren.setRenderTarget(null);qm.uniforms.time.value=now/1000;ren.render(qs,qc);
}

function tex(w,h,fn,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.anisotropy=4;return t}
const rnd=Math.random;
const asphalt=tex(512,512,(g,w,h)=>{g.fillStyle='#5d5d60';g.fillRect(0,0,w,h);for(let i=0;i<6000;i++){const v=70+rnd()*60|0;g.fillStyle='rgba('+v+','+v+','+(v+4)+',.5)';g.fillRect(rnd()*w,rnd()*h,2,2)}g.strokeStyle='rgba(20,20,22,.6)';g.lineWidth=1.5;for(let i=0;i<5;i++){g.beginPath();let x=rnd()*w,y=rnd()*h;g.moveTo(x,y);for(let j=0;j<6;j++){x+=rnd()*40-20;y+=rnd()*40-8;g.lineTo(x,y)}g.stroke()}},7,7.5);
const brick=tex(256,256,(g,w,h)=>{g.fillStyle='#b4ab9c';g.fillRect(0,0,w,h);for(let r=0;r<16;r++)for(let c=-1;c<8;c++){const x=c*32+(r%2?16:0),v=rnd()*40|0;g.fillStyle='rgb('+(150+v)+','+(66+v/2)+','+(50+v/3)+')';g.fillRect(x+1,r*16+1,30,14)}},10,2);
const fenceT=tex(32,32,g=>{g.strokeStyle='rgba(190,195,200,.95)';g.lineWidth=1.6;g.beginPath();g.moveTo(0,0);g.lineTo(32,32);g.moveTo(32,0);g.lineTo(0,32);g.stroke()},90,20);
const graf=tex(512,128,(g,w,h)=>{g.translate(w,0);g.scale(-1,1);g.font='italic 900 60px Impact,"Arial Black",sans-serif';g.textAlign='center';g.lineJoin='round';g.lineWidth=12;g.strokeStyle='#1b1b1b';g.strokeText('THUMBBALL',256,92);g.fillStyle='#ffd23a';g.fillText('THUMBBALL',256,92);g.lineWidth=2;g.strokeStyle='#e8431a';g.strokeText('THUMBBALL',256,92)});
const ballT=tex(256,128,(g,w,h)=>{g.fillStyle='#d9661c';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle='rgba(60,20,0,.18)';g.fillRect(rnd()*w,rnd()*h,1.5,1.5)}g.strokeStyle='#2a1204';g.lineWidth=3;g.beginPath();g.moveTo(0,64);g.lineTo(w,64);for(const x of[0,64,128,192,256]){g.moveTo(x,0);g.lineTo(x,h)}g.stroke()});
const M=(o)=>new THREE.MeshStandardMaterial(o);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2800,1400),M({map:asphalt,roughness:.95}));
ground.rotation.x=-Math.PI/2;ground.position.set(437,0,330);ground.receiveShadow=true;scene.add(ground);

gp.position.set(260,250,-268);scene.add(gp);

const metal=M({color:0x6d7378,metalness:.6,roughness:.5});
for(let x=-300;x<=1300;x+=200){const p=new THREE.Mesh(new THREE.BoxGeometry(5,175,5),metal);p.position.set(x,87,-130);p.castShadow=true;scene.add(p);(window.FO=window.FO||[]).push(p)}
const rail=new THREE.Mesh(new THREE.BoxGeometry(2800,4,4),metal);rail.position.set(437,172,-130);scene.add(rail);window.FO.push(rail);
const lw=new THREE.Mesh(new THREE.BoxGeometry(30,330,400),M({map:brick,roughness:1}));lw.position.set(-15,165,-70);lw.castShadow=true;lw.receiveShadow=true;scene.add(lw);

// Korb
const ty=GY-HY;
const board=new THREE.Mesh(new THREE.BoxGeometry(8,115,96),M({color:0xe6edf2,roughness:.4}));

const sq=new THREE.Mesh(new THREE.BoxGeometry(1.4,34,46),M({color:0xd33}));sq.position.set(BX-.7,ty+20,0);scene.add(sq);

const pole=new THREE.Mesh(new THREE.CylinderGeometry(5,6,ty+50,14),metal);pole.position.set(BX+32,(ty+50)/2,0);pole.castShadow=true;scene.add(pole);

rim.rotation.x=Math.PI/2;rim.position.set(HX-.5,ty,0);rim.castShadow=true;scene.add(rim);
const net=new THREE.Mesh(new THREE.CylinderGeometry(23.5,14,34,14,3,true),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true}));
net.position.set(HX-.5,ty-17,0);scene.add(net);net.visible=false;
let rimOn=false,rimBall=null;
// Netz als Feder-Simulation

 st.score+=pts;st.hits++;rH++;{const z=Math.floor(b.dist*MPU);if(z>=3&&z<=9)rz.add(z)}st.bn=b.burn?(st.bn||0)+1:0;st.streak++;st.cs=clean?st.cs+1:0;gain(xp);if(st.score>st.best)st.best=st.score;
 const oth=balls.filter(o=>o!==b&&o.live&&!o.f.scored&&o.seq),b1=[b,...oth].reduce((m,o)=>o.seq<m.seq?o:m);

function onScore2(b){
